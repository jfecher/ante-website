weight: 3
title: "Effects"
code: |
    effect Throw err =
        throw: fn err -> Never

    // Functions must declare which effects they use. E.g. The type system
    // prevents a function without the Net effect from accessing the network
    signup (name: String) (email: Email): User can IO, Throw ValidationErr, Throw IOErr =
        // Unlike monads, effects are trivial to combine.
        // signup throws multiple error kinds but we don't need an error union to combine them.
        cfg = read_cfg_from_disk () // can IO, Throw IOErr
        validate name email  // can Throw ValidationErr

    // No function coloring problem: map_vec trivially works with exceptions, async, etc.
    // Any effects required by `f` are reflected in its type and in the effects of `map_vec`'s callsite.
    map_vec (v: Vec t) (f: fn t => u): Vec u =
        Vec.of (map v f)
