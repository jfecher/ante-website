weight: 5
title: "Generators"
code: |
    // Generators are implemented via effects
    effect Emit elem =
        emit: fn elem -> Unit

    // One advantage of generators is that they are easier to write than iterators.
    // Our input stream can `Emit a` and `map` can `Emit b`
    map (stream: fn Unit => Unit can Emit a) (f: fn a => b): Unit can Emit b =
        handler emit_a for emit elem ->
            emit (f elem)
            resume ()
        in stream ()

    // From: `a,b,c\n1,2,3\n4,5,6`
    // Return: `[["1", "2", "3"], ["4", "5", "6"]]`
    parse_csv (text: String): Vec (Vec String) =
        lines text |> skip 1 |> map (fn line -> split line "," |> Vec.of) |> Vec.of
